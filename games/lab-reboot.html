<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1740">
<title>Lab Reboot: Arduino Missions · Pelen Hub</title>
<style>
:root{
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#edf2fb;--surface:#fff;--ink:#16294d;--muted:#526687;
  --copper:#ad760c;--on-copper:#fff;--pad:#cad6e9;--line:#dce4f2;
  --ok:#246a41;--bad:#b43427;--focus:#2469bd;
  --codebg:#0b1740;--codeink:#edf2fb;--codecm:#a1b5d8;--w-gnd:#272e34;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.5}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;line-height:1.05;margin:0}
p{margin:.5rem 0}
.wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem 3rem}
header.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1rem 0;border-bottom:2px solid var(--line);margin-bottom:1.75rem}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.6rem;font-weight:700;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.status{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.chip{border:2px solid var(--copper);border-radius:999px;padding:.1rem .75rem;font-weight:700;font-size:.95rem}
button{font:inherit}
.btn{background:var(--copper);color:var(--on-copper);border:2px solid var(--copper);border-radius:6px;padding:.6rem 1.1rem;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:36px;padding:.3rem .8rem;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.hero h1{font-size:clamp(2.8rem,8vw,5rem);max-width:12ch}
.hero p{max-width:58ch;color:var(--muted);font-size:1.15rem}

.map{list-style:none;margin:2.25rem 0 0;padding:0;position:relative}
.map::before{content:"";position:absolute;left:21px;top:30px;bottom:30px;width:6px;background:var(--copper);border-radius:3px}
.mrow{position:relative;display:grid;grid-template-columns:48px 1fr auto;gap:1rem;align-items:center;padding:.85rem 0}
.pad{width:48px;height:48px;border-radius:50%;background:var(--bg);border:6px solid var(--copper);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;position:relative;z-index:1}
.pad.done{background:var(--copper);color:var(--on-copper)}
.pad.locked{border-color:var(--pad);color:var(--muted)}
.mrow h3{font-size:1.7rem}
.mrow p{margin:.1rem 0 0;color:var(--muted)}
.mrow.locked h3,.mrow.locked p{opacity:.6}
.stars{color:var(--copper);font-size:1.1rem;letter-spacing:.08em;white-space:nowrap}
.stars .off{opacity:.3}
.teacher{margin-top:2.5rem;padding-top:1rem;border-top:2px solid var(--line);display:flex;gap:1rem;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.95rem}
.teacher label{display:flex;gap:.5rem;align-items:center;cursor:pointer}

.mhead{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.mhead h2{font-size:clamp(2rem,5vw,2.8rem)}
.steps{display:flex;align-items:center;margin:1.25rem 0 1.5rem;list-style:none;padding:0}
.steps li{display:flex;align-items:center;flex:1}
.steps li:last-child{flex:0 0 auto}
.sdot{width:30px;height:30px;border-radius:50%;border:4px solid var(--pad);background:var(--bg);flex:0 0 auto}
.sdot.on{border-color:var(--copper)}
.sdot.done{background:var(--copper);border-color:var(--copper)}
.slabel{margin:0 .5rem;font-weight:700;color:var(--muted)}
.slabel.on{color:var(--ink)}
.strace{flex:1;height:4px;background:var(--pad);min-width:10px}
.strace.done{background:var(--copper)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:1.25rem}
.brief{border-left:6px solid var(--copper);padding:.1rem 0 .1rem 1rem;margin-bottom:1.25rem;max-width:70ch}
.brief strong{display:block;font-size:1.05rem}
.how{color:var(--muted);margin:0 0 .75rem;max-width:70ch}
.feedback{min-height:1.6em;margin:.9rem 0;font-weight:700;max-width:70ch}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}

/* Circuit workspace only. Keep the other mission steps at their original width. */
.wrap:has(.workbench){max-width:1380px}
.workbench{margin:1.25rem 0 0;border:1px solid #aabbb5;border-radius:10px;overflow:hidden;background:#e6ece9;color:#233e38}
.benchbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#f6f8f6;border-bottom:1px solid #bdccc5}
.bench-title{display:flex;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.bench-title i{width:8px;height:8px;background:#248766;border-radius:50%;box-shadow:0 0 0 4px #dceee4}
.bench-tools{display:flex;align-items:center;gap:6px;font-size:.85rem}
.bench-tools button{border:1px solid #b5c7bd;border-radius:5px;background:#fff;color:#233e38;cursor:pointer;min-width:36px;min-height:36px;padding:4px 10px}
.bench-tools button:disabled{opacity:.4;cursor:default}
.bench-tools output{min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:72vh;overscroll-behavior-x:contain;scrollbar-color:#8aa69a #d9e3dd;background-color:#e6ece9;background-image:radial-gradient(#bbccc3 .8px,transparent .8px);background-size:16px 16px}
svg.circuit{width:1280px;max-width:none;min-width:0;height:auto;display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;touch-action:manipulation}
.bench-status{display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 18px;background:#f6f8f6;border-top:1px solid #bdccc5;font-size:.93rem}
.bench-status .status-dot{width:10px;height:10px;border:2px solid #718c80;border-radius:50%;flex-shrink:0}
.bench-status.selecting{background:#fff2d7}
.bench-status.selecting .status-dot{background:#c17614;border-color:#c17614;box-shadow:0 0 0 4px #edcf97}
.bench-status.connected .status-dot{background:#278660;border-color:#278660}
.bench-count{margin-left:auto;white-space:nowrap;color:#597368;font-size:.83rem}
.bench-help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin:.65rem 0}
.bench-help summary{cursor:pointer;font-weight:700}
.bench-help details{max-width:75ch}
.bench-help p{margin:.4rem 0}
.pin,.hole,.wire{cursor:pointer}
.pin:focus,.hole:focus,.wire:focus{outline:none}
.endpoint .hit{fill:transparent;pointer-events:all}
.endpoint .halo{fill:transparent;stroke:transparent;stroke-width:2;pointer-events:none}
.endpoint:hover .halo,.endpoint:focus-visible .halo{fill:#ffc95755;stroke:#bc7107}
.pin:hover .halo,.pin:focus-visible .halo{stroke:#ffdd84}
.endpoint.sel .halo{fill:#ffd36c88;stroke:#b26a00;stroke-width:3;filter:url(#selectionGlow)}
.endpoint.connected .halo{stroke:#50997b;stroke-width:1.5}
.endpoint.sel .halo{stroke:#b26a00;stroke-width:3}
.endpoint .rim,.endpoint .socket,.endpoint .plug{pointer-events:none}
.occupied{cursor:not-allowed}
.net-guide{pointer-events:none;fill:#ffc74918;stroke:#c18725;stroke-opacity:.5;stroke-width:1;stroke-dasharray:3 4}
.parts{pointer-events:none}
.wire path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire .cable-shadow{stroke:#132a25;stroke-opacity:.22;stroke-width:10;pointer-events:none;transform:translate(1px,4px)}
.wire .cable{stroke-width:6;pointer-events:none}
.wire .sheen{stroke:#fff;stroke-opacity:.3;stroke-width:1.5;pointer-events:none;transform:translateY(-1px)}
.wire .wire-hit{stroke:transparent;stroke-width:14;pointer-events:stroke}
.wire:hover .cable,.wire:focus-visible .cable{stroke-width:8}
.wire:focus-visible .wire-hit{stroke:#cb8e2c;stroke-opacity:.3;stroke-width:16}
.bench-silk{font-size:11px;fill:#5b7066;letter-spacing:1px}
.part-label{font-size:10px;fill:#536158;font-weight:700}
@media (max-width:560px){.benchbar{padding:10px}.bench-status{padding:10px;font-size:.85rem}.bench-count{display:none}.bench-help{font-size:.8rem}}

pre.code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;line-height:1.8;background:var(--codebg);color:var(--codeink);padding:1rem 1.1rem;border-radius:8px;overflow-x:auto;margin:0}
pre.code .cm{color:var(--codecm)}
pre.code select{font:inherit;font-weight:600;background:#0F5A4E;color:#fff;border:2px dashed #DA9750;border-radius:4px;padding:0 .15rem;cursor:pointer}
pre.code select.right{border:2px solid #62D891}
pre.code select.wrong{border:2px solid #FF8A7A}

.quiz{display:grid;gap:.6rem;max-width:62ch;margin-top:.75rem}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:.75rem 1rem;cursor:pointer;min-height:44px}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}
.qtext{font-size:1.2rem;font-weight:700;max-width:62ch}

.sim{display:flex;gap:2rem;align-items:center;justify-content:center;flex-wrap:wrap;padding:1.25rem;border-radius:8px;background:var(--codebg);color:var(--codeink);margin-bottom:1rem;min-height:220px}
.sim svg{width:110px;height:auto}
.sim .glow{filter:blur(10px)}
.bigbtn{width:120px;height:120px;border-radius:50%;border:8px solid #2a2a2a;background:#D63B2F;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 0 #7a1d16;touch-action:none;user-select:none;-webkit-user-select:none}
.bigbtn.down{transform:translateY(6px);box-shadow:0 2px 0 #7a1d16}
.bigbtn:disabled{opacity:.5;cursor:not-allowed}
.knob{display:grid;gap:.5rem;justify-items:center;min-width:220px}
.knob input{width:220px;accent-color:#DA9750}
.readout{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.95rem}
.note{font-family:"Barlow Condensed",sans-serif;font-size:3.5rem;min-width:1.5ch;text-align:center}
.serial{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.9rem;color:var(--muted);margin:0 0 1rem}

.done-view{text-align:left;max-width:60ch}
.done-view h2{font-size:clamp(2.6rem,7vw,4rem)}
.done-view .stars{font-size:2.2rem}

@media (max-width:560px){
  .slabel{display:none}
  .mrow{grid-template-columns:48px 1fr}
  .mrow .rowend{grid-column:2}
}
@media (prefers-reduced-motion:reduce){
  .sel .ring{animation:none}
}
/* Learning tools extend the original mission cards. */
.hint-card{margin-top:1.2rem;border:1px solid var(--line);border-left:4px solid var(--copper);border-radius:7px;padding:1rem;background:var(--bg);max-width:85ch}
.hint-heading{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
.hint-heading span{font-size:.85rem;color:var(--muted)}
.hint-level{display:flex;gap:.8rem;margin:.85rem 0;font-size:.98rem}
.hint-number{display:grid;place-items:center;background:var(--copper);color:var(--on-copper);border-radius:50%;width:25px;height:25px;flex:0 0 auto;font-weight:700}
.hint-level ul,.hint-level ol{margin:.4rem 0;padding-left:1.2rem}
#wirePreview{pointer-events:none}
.preview-cable{fill:none;stroke:#ac6a16;stroke-width:4;stroke-linecap:round;stroke-dasharray:8 6;opacity:.8}
.preview-end{fill:#fff1cc;stroke:#ac6a16;stroke-width:2}
.endpoint.destination .halo{fill:#ffcc5966;stroke:#a06410;stroke-width:3}
.diagnostic{pointer-events:none}
.fault-wire{fill:none;stroke:#c1432d;stroke-width:13;stroke-opacity:.55;stroke-dasharray:9 5;stroke-linecap:round}
.fault-area{fill:#ffd2ad44;stroke:#bc432a;stroke-width:3;stroke-dasharray:4 3}
.fault-mark{fill:#a3311b;font:bold 18px system-ui}
.live-stage{position:relative;width:1280px}
.live-stage svg.circuit{width:100%;pointer-events:none}
.live-stage .endpoint,.live-stage .wire{cursor:default}
.live-button,.live-knob{position:absolute;z-index:1;border:2px solid transparent;background:transparent;border-radius:8px;cursor:pointer;touch-action:none;color:#203d35}
.live-button span{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fff3d7;border:1px solid #c4a067;border-radius:4px;padding:1px 5px;font-size:10px;white-space:nowrap}
.live-button:hover:not(:disabled),.live-knob:hover:not([aria-disabled="true"]){border-color:#bd8531;background:#ffc43c25}
.live-button.down{background:#0a292740;box-shadow:inset 0 3px 4px #08252180;transform:translateY(2px)}
.live-button:disabled,.live-knob[aria-disabled="true"]{cursor:default}
.live-button:disabled span{opacity:.5}
.live-controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin:1rem 0}
.live-controls .knob{justify-items:start}
.live-controls .note{font-size:2rem;min-width:3ch;color:var(--copper)}
.live-label{font-size:.85rem;color:var(--muted)}
.live-glow{filter:blur(7px)}
.learning-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.5rem 0}
.learning-totals>div{padding:1rem;border-radius:8px;background:var(--bg)}
.learning-totals strong{display:block;font-size:1.9rem;color:var(--copper)}
.learning-totals span{font-size:.88rem;color:var(--muted)}
.table-scroll{overflow:auto;margin:1rem 0}
.learning-table{border-collapse:collapse;width:100%;min-width:760px;text-align:left;font-size:.92rem}
.learning-table caption{text-align:left;font-weight:700;padding-bottom:.7rem}
.learning-table td,.learning-table th{padding:.8rem;border-bottom:1px solid var(--line);vertical-align:top}
.learning-table thead{background:var(--bg)}
.teacher-view h2{font-size:2rem}
.docs-view section{margin:1.25rem 0}
.docs-view h3{font-size:1.3rem;margin-bottom:.4rem}
.docs-view ul{padding-left:1.2rem;display:grid;gap:.4rem;margin:0 0 .6rem}
.docs-view code{background:var(--bg);padding:.1rem .35rem;border-radius:4px;font-size:.9em}
.bonus-invite{border-top:1px solid var(--line);padding-top:1rem;margin-top:1.5rem}
.bonus-invite h3{font-size:1.6rem}
.experiment-fields{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0}
.experiment-fields label{display:grid;gap:.4rem;font-size:.95rem;font-weight:700}
.experiment-fields input,.experiment-fields select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:5px;min-height:42px;padding:.4rem;width:180px}
.experiment-code{margin:1rem 0}
.experiment-badge{display:inline-block;color:var(--ok);font-weight:700;margin:.5rem 0}
@media(max-width:650px){.learning-totals{grid-template-columns:repeat(2,1fr)}.hint-heading{gap:.2rem}}

/* ATS arcade visual system */
body{min-height:100svh;display:flex;flex-direction:column;font-family:'Avenir Next',Avenir,'Trebuchet MS',sans-serif;font-size:17px}
h1,h2,h3,.brand{font-family:'Avenir Next',Avenir,'Trebuchet MS',sans-serif;font-weight:850;letter-spacing:-.035em;line-height:1.15}
.hub-header{width:100%;max-width:1380px;margin:0 auto;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;font:700 11px/1.5 ui-monospace,monospace;letter-spacing:.08em}
.hub-header small{display:block;color:var(--muted);font-size:10px;letter-spacing:.025em;margin-top:3px}
.hub-header a{color:var(--ink);text-decoration:none;border:1px solid #bac8dd;border-radius:7px;padding:8px 12px;min-height:40px;display:flex;align-items:center;white-space:nowrap}
.hub-header a:hover{background:#fff}
.wrap,.wrap:has(.workbench){width:calc(100% - 40px);max-width:1320px;margin:0 auto 28px;padding:0 26px 26px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 38px #16294d0b}
header.top{padding:21px 0;margin-bottom:24px;border-bottom:1px solid var(--line);gap:14px}
.brand{text-align:left;font-size:29px;line-height:1.05}.brand small{display:block;font:700 10px/1.5 ui-monospace,monospace;letter-spacing:.15em;color:var(--muted);margin-bottom:5px}.brand .brand-dot{color:#bd840b}
.status{gap:8px}.chip{border:1px solid #d3ddef;background:#f1f5fc;border-radius:8px;padding:8px 12px;font-size:14px}.chip#total{color:#805300;background:#fff5d9;border-color:#ead5a4}
.btn{background:#f0b429;border-color:#f0b429;color:#0b1740;border-radius:9px;font-weight:800;min-height:46px;padding:10px 18px;transition:background .15s,transform .15s,box-shadow .15s}.btn:not(.ghost){box-shadow:0 3px 0 #b27b0e}.btn:hover:not(:disabled){background:#ffd36b;border-color:#ffd36b;transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}.btn.ghost{background:#fff;color:var(--ink);border-color:#c8d3e5}.btn.ghost:hover:not(:disabled){background:#edf2fb;border-color:#9cacc6}.btn.small{min-height:42px;font-size:14px;padding:7px 12px}:focus-visible{outline:3px solid #2469bd;outline-offset:4px}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(290px,.85fr);gap:32px;align-items:center;background:#0b1740;color:#fff;border-radius:14px;padding:32px 36px;overflow:hidden}.hero-copy{position:relative;z-index:1}.eyebrow{font:700 11px/1.5 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.hero .eyebrow{color:#f6c65b;display:flex;gap:9px;align-items:center}.signal-dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:#f0b429;box-shadow:0 0 0 4px #f0b4291c}.hero h1{font-size:clamp(36px,4.5vw,60px);letter-spacing:-.055em;line-height:1.02;max-width:13ch;margin:15px 0}.hero h1 em{color:#f6c65b;font-style:normal}.hero p{color:#c6d3ef;max-width:46ch;font-size:17px;line-height:1.6}.hero .actions{margin-top:23px}.hero .btn{font-size:17px;padding:12px 22px}.mission-flow{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px;font:12px/1.5 ui-monospace,monospace;color:#c6d3ef}.mission-flow b{color:#f6c65b;font-weight:400}

<div class="wrap">

    <button class="brand" id="brand" aria-label="Lab Reboot: mission map"><small>ARDUINO MISSIONS / MAKERSPACE</small>LAB REBOOT<span class="brand-dot">.</span></button>

</div>

<footer class="footer">// Games · The American School of Tampico · ROOM LB6 · 2026–2027<span class="who">Ms. Ma. Elena Montes (Ms. Pelen)</span></footer>
<script>
const GND = ['GND1','GND2','GND3'];

const GNDP = ['GND1'];
function ledParts(a){ return [
  {id:'led',type:'led',legs:[{id:'p',hole:'e'+a,short:'Anode (+)',label:'LED anode (+)'},{id:'n',hole:'e'+(a+1),short:'Cathode (−)',label:'LED cathode (−)'}]},
  {id:'res',type:'resistor',legs:[{id:'1',hole:'a'+(a+1)},{id:'2',hole:'T-'+(a+1)}]}
];}
function ledReqs(pin,name){ return [
  {leg:'led:p',pins:[pin],hint:`Run a wire from ${name} to a free hole in the anode (+) column.`},
  {notGnd:'led:n',hint:'The cathode (−) column is wired straight to GND, so the resistor gets skipped. Remove that wire.'},
  {leg:'res:2',pins:GNDP,hint:'The resistor ends in the top − rail. Connect that rail to a GND pin on the Arduino.'}
];}
function buttonPart(b){ return {id:'btn',type:'button',legs:[{id:'a',hole:'e'+b,short:'A',label:'Button leg A'},{id:'b',hole:'e'+(b+2),short:'B',label:'Button leg B'}]}; }
function buttonReq(){ return {pair:['btn:a','btn:b'],pins:[['D2'],GNDP],hint:'One button column goes to pin 2. The other column goes to GND (the − rail works too).'}; }
function buzzerPart(z){ return {id:'bz',type:'buzzer',legs:[{id:'p',hole:'e'+z,short:'+',label:'Buzzer +'},{id:'n',hole:'e'+(z+2),short:'−',label:'Buzzer −'}]}; }
function buzzerReqs(){ return [
  {leg:'bz:p',pins:['D8'],hint:'Run a wire from pin 8 to a free hole in the buzzer + column.'},
  {leg:'bz:n',pins:GNDP,hint:'The buzzer − column must reach GND. You can go through the − rail.'}
];}
function potPart(p){ return {id:'pot',type:'pot',legs:[{id:'l',hole:'e'+p,short:'L',label:'Pot left leg'},{id:'w',hole:'e'+(p+1),short:'W',label:'Pot wiper'},{id:'r',hole:'e'+(p+2),short:'R',label:'Pot right leg'}]}; }

const MELODY = [262,262,392,392,440,440,392];
const NOTE_NAMES = ['C','C','G','G','A','A','G'];

const MISSIONS = [
{
  id:'m1', title:'Power on', goal:'Blink an LED on pin 13.',
  story:'The lab status light is dead. Get it blinking so everyone knows the system is alive.',
  wireTip:'On a breadboard, the 5 holes in a column (a to e) are connected. The long + and − rails are connected along the whole board. The 220Ω resistor is already in place between the cathode (−) and the − rail.',
  comps:ledParts(8),
  req:ledReqs('D13','pin 13'),
  code:
`void setup() {
  pinMode(13, [[0]]);   // pin 13 sends power out
}

void loop() {
  digitalWrite(13, [[1]]);   // LED on
  delay([[2]]);              // wait 1 second
  digitalWrite(13, LOW);     // LED off
  delay(1000);
}`,
  blanks:[
    {opts:['INPUT','OUTPUT','HIGH'],ans:'OUTPUT',hint:'Pin 13 sends power out to the LED, so it is an OUTPUT.'},
    {opts:['HIGH','LOW','OUTPUT'],ans:'HIGH',hint:'HIGH means 5V on the pin, which turns the LED on.'},
    {opts:['1','100','1000'],ans:'1000',hint:'delay() counts in milliseconds. 1 second is 1000 ms.'}
  ],
  q:{text:'Why does the LED need a 220Ω resistor?',
     opts:['It limits the current so the LED does not burn out','It makes the LED blink','It lets the code read the LED'],
     ans:0, why:'Without a resistor, too much current flows and the LED (or the pin) can be damaged.'},
  run:'blink'
},
{
  id:'m2', title:'Door button', goal:'Light an LED only while a button is held.',
  story:'The lab door has a call button, but nothing happens when people press it. Wire it to a light.',
  wireTip:'The button legs sit in two columns. Wire one column to pin 2 and the other to GND. The LED works like mission 1.',
  comps:[buttonPart(3),...ledParts(14)],
  req:[buttonReq(),...ledReqs('D13','pin 13')],
  code:
`void setup() {
  pinMode(2, [[0]]);   // button, no extra resistor needed
  pinMode(13, OUTPUT);
}

void loop() {
  if (digitalRead(2) == [[1]]) {   // is the button pressed?
    digitalWrite(13, HIGH);
  } else {
    digitalWrite(13, [[2]]);
  }
}`,
  blanks:[
    {opts:['OUTPUT','INPUT_PULLUP','HIGH'],ans:'INPUT_PULLUP',hint:'INPUT_PULLUP turns on a resistor inside the Arduino, so the button only needs D2 and GND.'},
    {opts:['HIGH','LOW'],ans:'LOW',hint:'With INPUT_PULLUP, pressing the button connects D2 to GND, so it reads LOW.'},
    {opts:['HIGH','LOW'],ans:'LOW',hint:'When the button is not pressed, the LED should be off.'}
  ],
  q:{text:'With INPUT_PULLUP, what does digitalRead(2) return when the button is NOT pressed?',
     opts:['LOW','HIGH','It changes randomly'],
     ans:1, why:'The internal pull-up resistor holds the pin at 5V (HIGH) until the button connects it to GND.'},
  run:'button'
},
{
  id:'m3', title:'Alarm', goal:'Make an active buzzer beep.',
  story:'The lab alarm is silent. Hook up the buzzer and make it beep on a steady rhythm.',
  wireTip:'Wire pin 8 to the buzzer + column and the − column to GND. Connecting the − rail to GND lets many parts share it.',
  comps:[buzzerPart(9)],
  req:buzzerReqs(),
  code:
`void setup() {
  pinMode(8, OUTPUT);
}

void loop() {
  [[0]](8, [[1]]);   // buzzer on
  delay(200);
  digitalWrite(8, LOW);   // buzzer off
  [[2]](200);
}`,
  blanks:[
    {opts:['digitalRead','digitalWrite','pinMode'],ans:'digitalWrite',hint:'To turn a pin on or off, use digitalWrite.'},
    {opts:['HIGH','LOW','INPUT'],ans:'HIGH',hint:'HIGH sends 5V to the buzzer and turns it on.'},
    {opts:['delay','tone','wait'],ans:'delay',hint:'delay() pauses the program. There is no wait() in Arduino.'}
  ],
  q:{text:'Why can an active buzzer beep with just digitalWrite(8, HIGH)?',
     opts:['It has its own oscillator inside, so power is enough','Pin 8 is special for sound','It cannot. It always needs tone()'],
     ans:0, why:'An active buzzer makes its own fixed tone. You only switch it on and off.'},
  run:'alarm'
},
{
  id:'m4', title:'Melody', goal:'Play a song with a passive buzzer.',
  story:'The morning bell should play a tune, not a boring beep. Time for a passive buzzer.',
  wireTip:'Same wiring as the alarm, but this buzzer is passive.',
  comps:[buzzerPart(9)],
  req:buzzerReqs(),
  code:
`// C C G G A A G  (Twinkle Twinkle)
int melody[] = {262, 262, 392, 392, 440, 440, 392};

void setup() {
  pinMode(8, OUTPUT);
}

void loop() {
  for (int i = 0; i < 7; i++) {
    [[0]](8, melody[i], 300);   // pin, frequency, length in ms
    delay([[1]]);               // wait before the next note
  }
  [[2]](8);                     // silence
  delay(2000);
}`,
  blanks:[
    {opts:['digitalWrite','tone','analogRead'],ans:'tone',hint:'tone(pin, frequency, duration) makes a passive buzzer play a note.'},
    {opts:['0','40','400'],ans:'400',hint:'Wait longer than the 300 ms note, or the next note cuts it off.'},
    {opts:['tone','noTone','pinMode'],ans:'noTone',hint:'noTone(pin) stops the sound.'}
  ],
  q:{text:'Why does a passive buzzer need tone() to make sound?',
     opts:['It is broken without it','It has no oscillator, so tone() sends a wave at the note frequency','tone() gives it more voltage'],
     ans:1, why:'tone() switches the pin on and off very fast. The speed (frequency) decides the note.'},
  run:'melody'
},
{
  id:'m5', title:'Jukebox', goal:'Start and stop the song with one button.',
  story:'The lab jukebox needs an on/off switch. One press starts the song, the next press stops it.',
  wireTip:'You need the button from the door mission and the passive buzzer. Both can share the − rail for GND.',
  comps:[buttonPart(3),buzzerPart(14)],
  req:[buttonReq(),...buzzerReqs()],
  code:
`bool playing = false;

void setup() {
  pinMode(2, INPUT_PULLUP);
  pinMode(8, OUTPUT);
}

void loop() {
  if (digitalRead(2) == LOW) {   // button pressed
    playing = [[0]];             // flip on/off
    delay(250);                  // ignore the bounce
  }
  if ([[1]]) {
    playNextNote();              // plays the song note by note
  } else {
    [[2]](8);
  }
}`,
  blanks:[
    {opts:['true','false','!playing'],ans:'!playing',hint:'! means "not". playing = !playing flips true to false and false to true.'},
    {opts:['playing','!playing','digitalRead(8)'],ans:'playing',hint:'Only play notes while playing is true.'},
    {opts:['tone','noTone','delay'],ans:'noTone',hint:'When the song is off, noTone(8) keeps the buzzer silent.'}
  ],
  q:{text:'What is the delay(250) after a press for?',
     opts:['It makes the song slower','Button contacts bounce, so one press could flip it many times','It saves battery'],
     ans:1, why:'Metal contacts bounce for a few milliseconds. Without the pause, one press can count as several.'},
  run:'jukebox'
},
{
  id:'m6', title:'Dimmer', goal:'Control LED brightness with a knob.',
  story:'The lab lights are either blinding or off. Add a dimmer knob so people can pick the brightness.',
  wireTip:'A potentiometer has 3 legs. The outer legs go to 5V and GND, the middle leg (wiper) goes to A0. Tip: send 5V to the + rail and GND to the − rail first.',
  comps:[potPart(3),...ledParts(14)],
  req:[
    {leg:'pot:w',pins:['A0'],hint:'The wiper (middle leg) sends a changing voltage. Wire its column to analog pin A0.'},
    {pair:['pot:l','pot:r'],pins:[['5V'],['GND1']],hint:'The two outer legs of the pot go to 5V and GND (either order). Tip: use the + and − rails.'},
    ...ledReqs('D9','pin ~9 (PWM)')
  ],
  code:
`void setup() {
  pinMode(9, OUTPUT);
}

void loop() {
  int knob = [[0]](A0);                        // 0 to 1023
  int level = map(knob, 0, 1023, 0, [[1]]);    // scale it down
  [[2]](9, level);                             // 0 to 255 brightness
}`,
  blanks:[
    {opts:['digitalRead','analogRead','analogWrite'],ans:'analogRead',hint:'analogRead gives a number from 0 to 1023, not just HIGH or LOW.'},
    {opts:['100','255','1023'],ans:'255',hint:'analogWrite takes values from 0 to 255.'},
    {opts:['digitalWrite','analogWrite','tone'],ans:'analogWrite',hint:'analogWrite sets brightness. digitalWrite is only on or off.'}
  ],
  q:{text:'Why is the LED on pin ~9 instead of pin 13?',
     opts:['Pin 13 is only for blinking','~ pins support PWM, so analogWrite can dim the LED','Pin 9 has more voltage'],
     ans:1, why:'PWM switches the pin on and off very fast. More "on" time looks brighter.'},
  run:'dimmer'

const KEY = 'labReboot.v1';
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.stars) return s; }catch(e){}
  return {stars:{},unlockAll:false,sound:true};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
let store = load();
let V = {name:'home'};
let timers = [];
function later(fn,ms){ const t=setTimeout(()=>{timers=timers.filter(id=>id!==t);fn();},ms); timers.push(t); return t; }
function every(fn,ms){ const t=setInterval(fn,ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; stopTones(); }

const app = document.getElementById('app');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- sound ---------- */
let actx = null;
const voices=new Set();
function stopTones(){voices.forEach(o=>{try{o.stop();}catch(e){}});voices.clear();}
function tone(freq, ms, type='square', vol=0.05){
  if(!store.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain();
    voices.add(o);o.onended=()=>voices.delete(o);
    o.type=type; o.frequency.value=freq;
    const t=actx.currentTime, d=ms/1000;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.setValueAtTime(vol,Math.max(t+0.02,t+d-0.03));
    g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}

/* ---------- header ---------- */
function totalStars(){ return Object.values(store.stars).reduce((a,b)=>a+b,0); }
function rankName(n){ return n>=15?'Chief maker':n>=9?'Engineer':n>=4?'Technician':'Intern'; }
function renderHeader(){
  const n = totalStars();
  document.getElementById('rank').textContent = rankName(n);
  document.getElementById('total').textContent = `★ ${n} / ${MISSIONS.length*3}`;
  document.getElementById('soundBtn').textContent = store.sound ? 'Sound on' : 'Sound off';
  document.getElementById('soundBtn').setAttribute('aria-pressed',String(store.sound));
}
document.getElementById('soundBtn').onclick = ()=>{ store.sound=!store.sound;if(!store.sound)stopTones(); save(); renderHeader(); };
document.getElementById('brand').onclick = ()=>go({name:'home'});
document.getElementById('docsBtn').onclick = ()=>go({name:'docs'});

function starsHTML(n){ let s=''; for(let i=0;i<3;i++) s+= i<n?'★':'<span class="off">★</span>'; return `<span class="stars" aria-label="${n} of 3 stars">${s}</span>`; }
function unlocked(i){ return store.unlockAll || i===0 || store.stars[MISSIONS[i-1].id]!=null; }

function go(v){ clearTimers(); V=v; render(); window.scrollTo(0,0); }
function render(){
  renderHeader();
  if(V.name==='home') renderHome();
  else if(V.name==='mission') renderMission();
  else if(V.name==='teacher') renderTeacher();
  else if(V.name==='challenge') renderChallenge();
  else if(V.name==='docs') renderDocs();
}

/* ---------- documentation ---------- */
function renderDocs(){
  const parts = MISSIONS.map((m,i)=>`<li><strong>${i+1}. ${esc(m.title)}</strong> · ${esc(m.goal)}</li>`).join('');
  app.innerHTML = `<section class="panel docs-view">
    <div class="mhead"><button class="btn ghost small" id="docsBack">Missions</button><h2>About Lab Reboot</h2></div>

    <section>
      <h3>Goal</h3>
      <p class="how">Lab LB6 has gone dark. You play a new lab intern who has to bring six systems back online, one at a time: build the real circuit on a breadboard, write the matching Arduino sketch, and pass a short concept check before the system is marked fixed. Each mission can earn up to 3 stars, for 18 stars total.</p>
    </section>

    <section>
      <h3>Parts of the game</h3>
      <ul>${parts}</ul>
      <p class="how">After a mission is completed once, its <em>Bonus</em> challenge unlocks: a small variation on the same circuit that asks you to change the code, not the wiring. A <em>Learning dashboard</em> (from the home screen) tracks attempts, hints used and common mistakes per mission, and a <em>Teacher mode</em> toggle can unlock every mission for demoing or review.</p>
    </section>

    <section>
      <h3>Arduino parts used</h3>
      <ul>
        <li><strong>Arduino Uno</strong> and breadboard, wired with jumper leads.</li>
        <li><strong>LED + resistor</strong> · digital output (missions 1, 2) and PWM brightness control (mission 6).</li>
        <li><strong>Pushbutton</strong> · digital input, read with <code>digitalRead()</code> (missions 2, 5).</li>
        <li><strong>Active buzzer</strong> · a single-tone alarm driven with <code>digitalWrite()</code> (mission 3).</li>
        <li><strong>Passive buzzer</strong> · plays a melody with <code>tone()</code> (missions 4, 5).</li>
        <li><strong>Potentiometer</strong> · analog input read with <code>analogRead()</code> and mapped to output (mission 6).</li>
      </ul>
    </section>

    <section>
      <h3>Scoring and ranks</h3>
      <p class="how">Each mission is scored out of 3 stars based on wiring accuracy, code correctness and the concept check, for 18 stars in total. Your total star count sets your rank, shown at the top of the page: Intern, Technician, Engineer, then Chief maker.</p>
    </section>

    <section>
      <h3>Credits</h3>
      <p class="how">Designed by Ms. Ma. Elena Montes for her MakerSpace class, part of the Pelen Hub, to teach the fundamentals of circuits and Arduino programming (wiring, code and debugging) through short, self-paced, hands-on missions instead of a lecture.</p>
    </section>

      : `<button class="btn ${done?'ghost':''}" data-start="${i}" aria-label="${done?'Replay':'Start'} mission ${i+1}: ${esc(m.title)}">${done?'Replay':'Start mission →'}</button>`;

  app.innerHTML = `
  <section class="hero">
    <div class="hero-copy"><div class="eyebrow"><span class="signal-dot" aria-hidden="true"></span>${allDone?'MISSION ACCOMPLISHED':'YOUR LAB. YOUR NEXT MISSION.'}</div>
    <h1>${allDone ? 'Lab LB6 is<br><em>back online.</em>' : 'Bring the lab<br><em>back to life.</em>'}</h1>
    <p>${allDone ? 'Every system works. Replay your missions, collect every star, and take on the bonus challenges.' :
      'Six systems. One maker. Wire real circuits, bring your code to life, and reboot Lab LB6, one mission at a time.'}</p>
    ${next>=0 ? `<div class="actions"><button class="btn" data-start="${next}">${next===0 && totalStars()===0?'Start mission 1':'Continue: '+esc(MISSIONS[next].title)} →</button></div>`:''}
    <div class="mission-flow"><span>01 Wire</span><b>→</b><span>02 Code</span><b>→</b><span>03 Check</span><b>→</b><span>04 Run</span></div></div>
    ${labConsole()}

  <div class="mission-heading"><h2>Your missions<span style="color:#ad760c">.</span></h2><p>${completed} / ${MISSIONS.length} SYSTEMS ONLINE · ${totalStars()} / ${MISSIONS.length*3} ★</p></div>

    <button class="btn ghost small" id="resetBtn">Reset progress</button>

  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startMission(+b.dataset.start));

  document.getElementById('teacherReport').onclick=()=>go({name:'teacher'});

function startMission(i){ learningRecord(MISSIONS[i].id).attempts++;save();go({name:'mission',idx:i,step:0,wires:[],sel:null,issue:null,hints:{},code:{},mistakes:0,qDone:false,fb:null}); }

/* ---------- mission shell ---------- */
function renderMission(){
  const m = MISSIONS[V.idx];
  if(V.step===4){ renderDone(m); return; }
  const steps = STEPS.map((s,i)=>{
    const cls = i<V.step?'done':i===V.step?'on':'';
    const tr = i<STEPS.length-1 ? `<span class="strace ${i<V.step?'done':''}"></span>` : '';
    return `<li aria-label="${s}"${i===V.step?' aria-current="step"':''}><span class="sdot ${cls}" aria-hidden="true"></span><span class="slabel ${i===V.step?'on':''}">${s}</span>${tr}</li>`;
  }).join('');
  app.innerHTML = `
  <div class="mhead">
    <button class="btn ghost small" id="backBtn">Missions</button>
    <h2>Mission ${V.idx+1}: ${esc(m.title)}</h2>
  </div>
  <ol class="steps" aria-label="Step ${V.step+1} of 4: ${STEPS[V.step]}">${steps}</ol>
  <section class="panel" id="panel"></section>`;
  document.getElementById('backBtn').onclick=()=>go({name:'home'});
  const panel = document.getElementById('panel');
  [stepWire,stepCode,stepCheck,stepRun][V.step](m,panel);
}
function nextStep(){ clearTimers(); V.step++; V.fb=null; render(); window.scrollTo(0,0); }
function setFb(el,ok,msg){ el.className='feedback '+(ok?'ok':'bad'); el.textContent=msg; }

/* ---------- step 1: wire (breadboard) ---------- */
const BB = {x0:686, pitch:24, cols:22};
const ROWY = {a:246,b:270,c:294,d:318,e:342,f:402,g:426,h:450,i:474,j:498};
const RAILY = {'T+':150,'T-':178,'B-':552,'B+':578};
const colX = c => BB.x0+(c-1)*BB.pitch;
function parseHole(h){ const m=h.match(/^(T\+|T-|B-|B\+|[a-j])(\d+)$/); return {r:m[1],c:+m[2]}; }
function holePos(h){
  const {r,c}=parseHole(h), rail=r.length===2;
  return {x:colX(c), y:rail?RAILY[r]:ROWY[r], up: rail ? r[0]==='T' : 'abcde'.includes(r)};
}
function netOfHole(h){ const {r,c}=parseHole(h); return r.length===2 ? 'R'+r : 'S'+c+('abcde'.includes(r)?'T':'B'); }
function allHoles(){
  const out=[];
  for(let c=1;c<=BB.cols;c++){ for(const r of Object.keys(RAILY)) out.push(r+c); for(const r of Object.keys(ROWY)) out.push(r+c); }
  return out;
}
function legsOf(m){ const out=[]; m.comps.forEach(c=>c.legs.forEach(l=>out.push({...l,key:c.id+':'+l.id,comp:c}))); return out; }
function epPos(ep){
  if(ep.startsWith('h:')){ const p=holePos(ep.slice(2)); return {x:p.x,y:p.y,off:p.up?-35:35}; }
  const p=PIN[ep]; return {x:p.x,y:p.y,off:p.top?-45:40};
}
function epName(ep){ return ep.startsWith('h:') ? 'breadboard hole '+ep.slice(2) : (/^D\d+$/.test(ep)?ep+' (pin '+PIN[ep].label+')':'pin '+PIN[ep].label); }
function usedEps(){ const s=new Set(); V.wires.forEach(w=>{s.add(w.a);s.add(w.b);}); return s; }
function wireColor(w,i){
  const e=[w.a,w.b];
  if(e.some(x=>GND.includes(x)||/^h:[TB]-/.test(x))) return '#272e34';
  if(e.some(x=>x==='5V'||/^h:[TB]\+/.test(x))) return '#D8322A';
  return WIRE_COLORS[i%WIRE_COLORS.length];
}

function endpointSVG(id,p,isPin=false){
  const sel=V.sel===id, used=usedEps().has(id), name=epName(id), r=isPin?8:9;
  return `<g class="endpoint ${isPin?'pin':'hole'} ${sel?'sel':''} ${used?'connected':''}" data-ep="${id}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="${esc(name)}${used?', jumper attached':''}">
    <title>${esc(name)}${used?' · jumper attached':''}</title>
    ${!isPin?`<rect class="rim" x="${p.x-5}" y="${p.y-5}" width="10" height="10" rx="2.7" fill="#d0d0c8" stroke="#fff" stroke-width="1"/>
    <rect class="socket" x="${p.x-3}" y="${p.y-3}" width="6" height="6" rx="1.4" fill="#343d3c"/><path d="M${p.x-2} ${p.y+2}h4" stroke="#92968e" stroke-width="1"/>`:''}
    <circle class="halo" cx="${p.x}" cy="${p.y}" r="${r}"/>
    ${used?`<rect class="plug" x="${p.x-4}" y="${p.y-5}" width="8" height="10" rx="2" fill="#283137" stroke="#838e8d"/><rect class="plug" x="${p.x-1.5}" y="${p.y-2}" width="3" height="4" rx="1" fill="#cad0cb"/>`:''}

}
function pinsSVG(){ return Object.entries(PIN).map(([id,p])=>endpointSVG(id,p,true)).join(''); }
function bbSVG(m){
  const occ=new Map(legsOf(m).map(l=>[l.hole,l]));
  let s=`<g aria-hidden="true"><rect x="652" y="129" width="584" height="483" rx="12" fill="#c4c9bf" filter="url(#boardShadow)"/>
    <rect x="652" y="124" width="584" height="480" rx="11" fill="url(#plastic)" stroke="#bac2b7"/>

    <rect x="665" y="363" width="558" height="18" rx="4" fill="#c7ccc3" stroke="#b6bcb1"/>
    <path d="M670 379h548" stroke="#fffffa" stroke-width="2"/>
    ${[210,526].map(y=>`<path d="M665 ${y}h558" stroke="#d1d5ca"/><path d="M665 ${y+2}h558" stroke="#fff"/>`).join('')}
    <path d="M675 137h530 M675 592h530" stroke="#cb594d" stroke-width="2"/>

    ${Object.entries(ROWY).map(([r,y])=>`<text x="666" y="${y+4}" font-size="11" fill="#69746b" text-anchor="middle">${r}</text><text x="1211" y="${y+4}" font-size="11" fill="#69746b" text-anchor="middle">${r}</text>`).join('')}
    ${Array.from({length:BB.cols},(_,i)=>i+1).map(c=>`<text x="${colX(c)}" y="229" font-size="9" text-anchor="middle" fill="#6c786e">${c}</text><text x="${colX(c)}" y="518" font-size="9" text-anchor="middle" fill="#6c786e">${c}</text>`).join('')}
    <text class="bench-silk" x="668" y="628">02 / SOLDERLESS BREADBOARD</text>
    <text x="668" y="647" fill="#6c8077" font-size="12">Components are placed. You make the connections.</text></g>`;
  // Display only existing internal nets, never the solution or a required endpoint.
  if(V.showNets && V.sel?.startsWith('h:')){
    const {r,c}=parseHole(V.sel.slice(2)), p=holePos(V.sel.slice(2));
    s+=r.length===2?`<rect class="net-guide" x="675" y="${p.y-11}" width="527" height="22" rx="10"/>`:
      `<rect class="net-guide" x="${colX(c)-11}" y="${'abcde'.includes(r)?235:391}" width="22" height="118" rx="10"/>`;
  }
  allHoles().forEach(h=>{
    const p=holePos(h), l=occ.get(h);
    if(l){ s+=`<g class="occupied" role="img" aria-label="${esc(l.label||l.comp.type+' lead')} occupies ${h}"><title>${esc(l.label||l.comp.type+' lead')} · ${h} occupied</title><rect x="${p.x-5}" y="${p.y-5}" width="10" height="10" rx="2" fill="#3e4847"/><circle cx="${p.x}" cy="${p.y}" r="3" fill="url(#metal)" stroke="#6e7976"/></g>`; }

function partsSVG(m){
  let s='<g class="parts" aria-hidden="true">';
  const leg=(a,b)=>`<path d="M${a.x} ${a.y}L${b.x} ${b.y}" fill="none" stroke="#6f7d80" stroke-width="4" stroke-linecap="round"/><path d="M${a.x-0.6} ${a.y}L${b.x-0.6} ${b.y}" stroke="#e5eceb" stroke-width="1.6"/>`;
  m.comps.forEach(c=>{
    const L=c.legs.map(l=>({...l,...holePos(l.hole)})), cx=L.reduce((v,l)=>v+l.x,0)/L.length;
    if(c.type==='resistor'){
      const a=L[0], b=L[1], length=Math.hypot(b.x-a.x,b.y-a.y), angle=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      s+=`<g transform="translate(${a.x},${a.y}) rotate(${angle})">${leg({x:0,y:0},{x:length,y:0})}
        <g filter="url(#partShadow)"><path d="M${length/2-22} -6Q${length/2-25} 0 ${length/2-22} 6L${length/2-16} 7H${length/2+16}L${length/2+22} 6Q${length/2+25} 0 ${length/2+22} -6L${length/2+16} -7H${length/2-16}Z" fill="url(#resin)" stroke="#997c4c"/>
        ${[[-14,'#b82b26'],[-6,'#b82b26'],[2,'#704225'],[15,'#bf983a']].map(([x,col])=>`<rect x="${length/2+x}" y="-6.5" width="3.5" height="13" fill="${col}"/>`).join('')}</g></g>
        <text class="part-label" x="${cx+15}" y="215">220Ω</text>`;
    }else if(c.type==='led'){
      s+=leg(L[0],{x:cx-5,y:367})+leg(L[1],{x:cx+5,y:367});
      s+=`<g filter="url(#partShadow)"><path d="M${cx-13} 369a14 14 0 1 1 0 16Z" fill="#b93328" stroke="#8f3027"/>
        <circle cx="${cx}" cy="376" r="12" fill="url(#redLens)"/>
        <path d="M${cx-5} 372v9h4v-7h5v7" stroke="#862921" fill="none" opacity=".5" stroke-width="2"/>
        <ellipse cx="${cx-4}" cy="371" rx="3" ry="5" fill="#fff" opacity=".55" transform="rotate(28 ${cx-4} 371)"/></g>
        <text class="part-label" x="${L[0].x-11}" y="358">+</text><text class="part-label" x="${L[1].x+7}" y="358">−</text>
        <text class="part-label" x="${cx+25}" y="379">LED</text>`;
    }else if(c.type==='button'){
      s+=L.map((l,i)=>leg(l,{x:cx+(i?17:-17),y:362})).join('');
      s+=`<g filter="url(#partShadow)"><rect x="${cx-21}" y="356" width="42" height="33" rx="4" fill="#23282b"/>
        <rect x="${cx-18}" y="359" width="36" height="27" rx="3" fill="url(#metal)"/>
        ${[-15,15].map(dx=>`<circle cx="${cx+dx}" cy="362" r="2" fill="#525b5c"/><circle cx="${cx+dx}" cy="383" r="2" fill="#525b5c"/>`).join('')}
        <circle cx="${cx}" cy="372" r="11" fill="#121b20"/><circle cx="${cx}" cy="370" r="8.5" fill="url(#blackBody)"/></g>
        <text class="part-label" x="${L[0].x-10}" y="354">A</text><text class="part-label" x="${L[1].x+5}" y="354">B</text>`;

function wirePath(w,i){
  const A=epPos(w.a), B=epPos(w.b), lift=70+(i%6)*19;
  // Cables rise from their sockets; distinct offsets keep parallel jumpers legible.
  const ay=Math.max(28,Math.min(672,A.y+(A.off<0?-lift:lift)));
  const by=Math.max(28,Math.min(672,B.y+(B.off<0?-lift:lift)));
  return `M${A.x} ${A.y} C${A.x} ${ay}, ${B.x} ${by}, ${B.x} ${B.y}`;
}

function checkWiring(m){
  if(!V.wires.length) return {ok:false,kind:'empty',msg:'Run your first jumper wire: tap a pin on the Arduino, then a hole on the breadboard.'};
  const P={};
  const f=x=>{ while(P[x]) x=P[x]; return x; };
  const u=(a,b)=>{ a=f(a); b=f(b); if(a!==b) P[a]=b; };
  const node=ep=>ep.startsWith('h:')?netOfHole(ep.slice(2)):ep;
  u('GND2','GND1'); u('GND3','GND1');
  V.wires.forEach(w=>u(node(w.a),node(w.b)));
  const legs=legsOf(m);
  const legNet=k=>f(netOfHole(legs.find(l=>l.key===k).hole));
  const G=f('GND1');
  for(const pw of ['5V','3V3','VIN']) if(f(pw)===G) return {ok:false,kind:'power_short',wires:traceWires(pw,'GND1'),msg:`Short circuit: ${PIN[pw].label} reaches GND through the marked jumper path, without a load. Break that path before testing.`};
  if(f('5V')===f('3V3')||f('5V')===f('VIN')) return {ok:false,kind:'power_link',wires:traceWires('5V',f('5V')===f('3V3')?'3V3':'VIN'),msg:'Two power pins are joined by the marked path. Different power supplies must not be connected directly.'};
  const sigPins=new Set(); m.req.forEach(r=>(r.pins||[]).flat().forEach(p=>{ if(p!=='GND1'&&p!=='5V') sigPins.add(p); }));
  for(const p of sigPins){
    if(f(p)===G) return {ok:false,kind:'signal_short',wires:traceWires(p,'GND1'),msg:`Pin ${PIN[p].label} reaches GND directly through the marked path. This bypasses the intended load.`};
    if(f(p)===f('5V')) return {ok:false,kind:'signal_short',wires:traceWires(p,'5V'),msg:`Pin ${PIN[p].label} is tied directly to 5V by the marked path. It cannot control that signal independently.`};
  }
  for(const r of m.req){
    if(r.leg){ const n=legNet(r.leg); if(!r.pins.some(p=>f(p)===n)) return {ok:false,kind:'missing_connection',legs:[r.leg],msg:r.hint,explain:'The marked terminal does not reach its required electrical network. Follow its strip and check where your jumper ends. Ask for a hint if you need help.'}; }
    else if(r.pair){
      const a=legNet(r.pair[0]), b=legNet(r.pair[1]);
      const inA=set=>set.some(p=>f(p)===a), inB=set=>set.some(p=>f(p)===b);
      const ok=(inA(r.pins[0])&&inB(r.pins[1]))||(inB(r.pins[0])&&inA(r.pins[1]));
      if(!ok) return {ok:false,kind:'button_connection',legs:r.pair,msg:r.hint,explain:'Review the two marked terminals. Each needs its own electrical connection; the two strips must not be joined together.'};
    }
    else if(r.notGnd){ if(legNet(r.notGnd)===G) return {ok:false,kind:'resistor_bypass',legs:[r.notGnd],wires:traceWires('h:'+legs.find(l=>l.key===r.notGnd).hole,'GND1'),msg:'The marked path takes the LED cathode directly to GND, bypassing the resistor. Current must pass through the resistor instead.'}; }
  }
  return {ok:true};
}

function codeHTML(m){

function initLiveWorkbench(m){
  const scroll=document.getElementById('liveScroll'),stage=document.getElementById('liveScene');let zoom=Math.max(.9,Math.min(1,scroll.clientWidth/1280));
  const resize=()=>{stage.style.width=1280*zoom+'px';document.getElementById('liveZoomLevel').textContent=Math.round(100*zoom)+'%';document.getElementById('liveZoomOut').disabled=zoom<=.9;document.getElementById('liveZoomIn').disabled=zoom>=1.6;};
  document.getElementById('liveZoomOut').onclick=()=>{zoom=Math.max(.9,+(zoom-.1).toFixed(1));resize();};
  document.getElementById('liveZoomIn').onclick=()=>{zoom=Math.min(1.6,+(zoom+.1).toFixed(1));resize();};resize();
  const knob=document.getElementById('potKnob'),pot=document.getElementById('pot');
  if(knob&&pot){
    let drag=null;
    const update=n=>{if(pot.disabled)return;pot.value=String(Math.round(Math.max(0,Math.min(1023,n))));pot.dispatchEvent(new Event('input',{bubbles:true}));};
    knob.onpointerdown=e=>{if(pot.disabled)return;e.preventDefault();knob.focus();drag={x:e.clientX,value:+pot.value};knob.setPointerCapture(e.pointerId);};
    knob.onpointermove=e=>{if(drag)update(drag.value+(e.clientX-drag.x)*1023/(180*zoom));};
    knob.onpointerup=knob.onpointercancel=knob.onlostpointercapture=()=>{drag=null;};
    knob.onkeydown=e=>{if(pot.disabled)return;const delta={ArrowLeft:-32,ArrowDown:-32,ArrowRight:32,ArrowUp:32,PageDown:-128,PageUp:128};if(e.key in delta||e.key==='Home'||e.key==='End'){e.preventDefault();update(e.key==='Home'?0:e.key==='End'?1023:+pot.value+delta[e.key]);}};
    pot.addEventListener('input',()=>updatePotAppearance(+pot.value));
  }
}

// The same simulation powers mission tests and optional code experiments.
function runSim(m,serial,ready,cfg={}){
  if(m.run==='blink'){
    let on=false,n=0;
    const tick=()=>{on=!on;setLed(on?1:0);serial.textContent=on?`LED on (blink ${++n})`:'LED off';if(on&&n===3)ready('Three blinks observed. Compare the on and off timing.');later(tick,on?(cfg.onMs??1000):(cfg.offMs??1000));};tick();
  }
  if(m.run==='button'){
    const b=document.getElementById('pressBtn');b.disabled=false;let pressed=false;
    const released=cfg.invert?1:0;setLed(released);serial.textContent=`Button released: digitalRead(2) = HIGH, LED ${released?'on':'off'}`;
    const down=e=>{if(b.disabled)return;e.preventDefault();b.classList.add('down');setLed(1-released);pressed=true;serial.textContent=`Button pressed: digitalRead(2) = LOW, LED ${released?'off':'on'}`;};
    const up=()=>{if(!b.classList.contains('down'))return;b.classList.remove('down');setLed(released);serial.textContent=`Button released: digitalRead(2) = HIGH, LED ${released?'on':'off'}`;if(pressed)ready('Both button states tested.');};
    b.onpointerdown=down;b.onpointerup=b.onpointerleave=b.onpointercancel=up;
    b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)down(e);};b.onkeyup=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();up();}};
  }
  if(m.run==='alarm'){
    let n=0;const on=cfg.onMs??200,off=cfg.offMs??200;
    const beep=()=>{n++;waves(true);tone(2300,on,'square',.035);serial.textContent=`Beep ${n}: ${on} ms on, ${off} ms off`;later(()=>waves(false),on);
      if(n>=8){later(()=>ready('Eight beeps observed. The loop repeats; we paused it here.'),on);return;}later(beep,on+off);};beep();
  }
  if(m.run==='melody'){
    let i=0;const note=document.getElementById('note');
    const play=()=>{if(i>=MELODY.length){waves(false);note.textContent='';ready('Melody played. Compare the pitch.');return;}const f=Math.round(MELODY[i]*(cfg.pitch??1));waves(true);tone(f,300,'square',.04);note.textContent=NOTE_NAMES[i];serial.textContent=`tone(8, ${f}, 300)`;later(()=>waves(false),300);i++;later(play,400);};play();
  }
  if(m.run==='jukebox'){
    const b=document.getElementById('pressBtn'),note=document.getElementById('note');b.disabled=false;
    let playing=false,i=0,beenOn=false,loop=null,waveTimer=null;
    const stepNote=()=>{waves(true);tone(MELODY[i],300,'square',.04);note.textContent=NOTE_NAMES[i];waveTimer=later(()=>waves(false),300);i=(i+1)%MELODY.length;};
    const toggle=()=>{playing=!playing;if(playing){beenOn=true;serial.textContent='playing = true';stepNote();loop=every(stepNote,400);}else{clearInterval(loop);clearTimeout(waveTimer);stopTones();waves(false);note.textContent='';serial.textContent='playing = false, noTone(8)';if(beenOn)ready('The button stopped the song.');}};
    b.onclick=()=>{b.classList.add('down');later(()=>b.classList.remove('down'),150);toggle();};
    serial.textContent='Press the breadboard button to start the song.';if(cfg.bootPlaying)toggle();
  }
  if(m.run==='dimmer'){
    const pot=document.getElementById('pot'),read=document.getElementById('read'),knob=document.getElementById('potKnob');pot.disabled=false;if(knob)knob.setAttribute('aria-disabled','false');let hi=false,done=false;
    serial.textContent='Turn the knob all the way up, then all the way down.';
    pot.oninput=()=>{const k=+pot.value,low=cfg.low??0,high=cfg.high??255,lvl=low+Math.trunc(k*(high-low)/1023);setLed(lvl/255);read.textContent=`knob = ${k}, level = ${lvl}`;updatePotAppearance(k);if(k>950)hi=true;if(k<60&&hi&&!done){done=true;ready('Both ends of the brightness range tested.');}};pot.oninput();
  }
}

function exampleWires(m){
  const legs=legsOf(m),taken=new Set(legs.map(l=>l.hole)),pins=new Set(),out=[];
  const connect=(key,pin)=>{
    const leg=legs.find(l=>l.key===key),net=netOfHole(leg.hole);
    const hole=allHoles().find(h=>netOfHole(h)===net&&!taken.has(h));
    if(GND.includes(pin))pin=GND.find(p=>!pins.has(p));
    taken.add(hole);pins.add(pin);out.push({a:pin,b:'h:'+hole});
  };
  m.req.forEach(r=>{if(r.leg)connect(r.leg,r.pins[0]);if(r.pair)r.pair.forEach((k,i)=>connect(k,r.pins[i][0]));});
  return out;
}

/* Find an actual jumper path between two electrical nodes for visual diagnostics. */
function traceWires(from,to){
  const node=ep=>ep.startsWith('h:')?netOfHole(ep.slice(2)):GND.includes(ep)?'GND1':ep;
  from=node(from);to=node(to);const edges=new Map();
  V.wires.forEach((w,i)=>{const a=node(w.a),b=node(w.b);if(!edges.has(a))edges.set(a,[]);if(!edges.has(b))edges.set(b,[]);edges.get(a).push([b,i]);edges.get(b).push([a,i]);});
  const queue=[[from,[]]],seen=new Set([from]);
  for(let q=0;q<queue.length;q++){const [a,path]=queue[q];if(a===to)return path;for(const [b,i] of edges.get(a)||[]){if(!seen.has(b)){seen.add(b);queue.push([b,path.concat(i)]);}}}
  return [];
}
function diagnosticSVG(m){

  (V.issue.wires||[]).forEach(i=>{if(V.wires[i])s+=`<path class="fault-wire" d="${wirePath(V.wires[i],i)}"/>`;});
  (V.issue.legs||[]).forEach(key=>{const l=legsOf(m).find(l=>l.key===key);if(!l)return;const p=holePos(l.hole);s+=`<circle class="fault-area" cx="${p.x}" cy="${p.y}" r="15"/><text x="${p.x+12}" y="${p.y-13}" class="fault-mark">!</text>`;});

}

/* Pointer positions are transformed through the SVG matrix, so zoom and scrolling agree. */
function mountWirePreview(box,isBusy){
  const clear=()=>{box.querySelector('#wirePreview')?.replaceChildren();box.querySelectorAll('.destination').forEach(el=>el.classList.remove('destination'));};
  const label=ep=>ep.startsWith('h:')?ep.slice(2):GND.includes(ep)?'GND':ep;
  const paint=(p,destination)=>{
    clear();if(!V.sel||isBusy())return;
    const A=epPos(V.sel),group=box.querySelector('#wirePreview');if(!group)return;
    const available=destination&&destination!==V.sel&&!usedEps().has(destination);
    if(available)box.querySelector(`[data-ep="${destination}"]`)?.classList.add('destination');
    const text=label(V.sel)+' → '+(destination?(destination===V.sel?'click again to cancel':label(destination)+(available?'':' · occupied')):'choose a socket');
    const width=Math.max(140,text.length*7+20),x=Math.max(8,Math.min(1272-width,p.x+16)),y=Math.max(28,Math.min(664,p.y-18));
    const lift=70+(V.wires.length%6)*19;
    const d=`M${A.x} ${A.y} C${A.x} ${Math.max(20,Math.min(670,A.y+(A.off<0?-lift:lift)))}, ${p.x} ${Math.max(20,p.y-lift)}, ${p.x} ${p.y}`;
    group.innerHTML=`<path class="preview-cable" d="${d}"/><circle class="preview-end" cx="${p.x}" cy="${p.y}" r="5"/><g><rect x="${x}" y="${y-20}" width="${width}" height="27" rx="5" fill="#fff7e3" stroke="#c09a53"/><text x="${x+10}" y="${y-2}" fill="#604414" font-size="12" font-family="system-ui,sans-serif">${esc(text)}</text></g>`;
  };
  box.addEventListener('pointermove',e=>{
    if(!V.sel||isBusy()){clear();return;}
    const svg=box.querySelector('svg'),matrix=svg.getScreenCTM();if(!matrix)return;
    const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;
    const p=point.matrixTransform(matrix.inverse()),ep=e.target.closest('[data-ep]');

  });
  box.addEventListener('pointerleave',clear);
  box.addEventListener('focusin',e=>{const ep=e.target.closest('[data-ep]');if(ep&&V.sel)paint(epPos(ep.dataset.ep),ep.dataset.ep);});
  box.addEventListener('focusout',e=>{if(!box.contains(e.relatedTarget))clear();});

function validSavedWires(w,m){
  if(!Array.isArray(w)||!w.length)return false;
  const ids=new Set([...Object.keys(PIN),...allHoles().map(h=>'h:'+h)]),occupied=new Set(legsOf(m).map(l=>'h:'+l.hole)),used=new Set();
  return w.every(x=>{if(!x||!ids.has(x.a)||!ids.has(x.b)||x.a===x.b||occupied.has(x.a)||occupied.has(x.b)||used.has(x.a)||used.has(x.b))return false;used.add(x.a);used.add(x.b);return true;});
}

    ${liveWorkbenchHTML(m,V.reference)}
    ${V.reference?'<p class="live-label">Your earlier completion predates saved circuits, so this experiment uses a valid reference circuit.</p>':''}
    <p class="serial" id="serial" aria-live="polite">Ready to experiment.</p><p class="feedback" id="experimentFeedback" aria-live="polite"></p>
    <div class="actions"><button class="btn" id="experimentRun">Run experiment</button><button class="btn ghost" id="experimentStop" disabled>Stop</button><button class="btn ghost" id="experimentDone">Back to missions</button></div></section>`;
  initLiveWorkbench(m);
  const fields=Array.from(app.querySelectorAll('[data-setting]')),serial=document.getElementById('serial'),fb=document.getElementById('experimentFeedback'),stop=document.getElementById('experimentStop');
  const read=()=>Object.fromEntries(fields.map(el=>[el.dataset.setting,el.tagName==='SELECT'?el.value:Number(el.value)]));
  const code=()=>{document.getElementById('experimentCode').textContent=c.code(read());};
  const halt=()=>{clearTimers();resetLiveControls();stop.disabled=true;};
  fields.forEach(el=>el.oninput=()=>{halt();code();fb.textContent='';serial.textContent='Code changed. Run the experiment to test it.';});
  stop.onclick=()=>{halt();serial.textContent='Experiment stopped. Adjust the values and run again.';};
  document.getElementById('experimentRun').onclick=()=>{
    if(!fields.every(el=>el.reportValidity()))return;
    halt();const settings=read();settings.invert=settings.readState==='HIGH';settings.bootPlaying=settings.boot==='true';
    const a=learningRecord(m.id);a.challengeAttempts++;save();fb.textContent='';stop.disabled=false;serial.textContent='Running your modified code…';
    let checked=false;
    runSim(m,serial,msg=>{serial.textContent=msg;if(checked)return;checked=true;
      if(c.ok(settings)){a.challengeDone=true;save();setFb(fb,true,'Experiment complete. '+c.why);tone(990,120,'sine',.04);}
      else setFb(fb,false,'The circuit ran, but the goal is not met yet. '+c.why);
    },settings);
  };
  document.getElementById('bonusBack').onclick=document.getElementById('experimentDone').onclick=()=>go({name:'home'});code();
}


render();
</script>
</body>
</html>
